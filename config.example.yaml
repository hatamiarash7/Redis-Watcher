# =============================================================================
# Redis Watcher - Example Configuration
# -----------------------------------------------------------------------------
# Copy this file to `config.yaml` and adjust to your environment.
# All values may also be overridden via environment variables using the
# `REDIS_WATCHER_*` prefix (see README).
# =============================================================================

# ---- Redis connection ---------------------------------------------------------
redis:
  # "unix" or "tcp"
  network: unix
  # For "unix": path to redis socket. For "tcp": host:port
  address: /var/run/redis/redis.sock
  # Optional auth
  username: ""
  password: ""
  # Connection / read timeouts
  dial_timeout: 5s
  read_timeout: 0s # 0 disables read deadline (recommended for MONITOR)
  # Reconnect backoff
  backoff_min: 1s
  backoff_max: 30s

# ---- Logging ------------------------------------------------------------------
log:
  level: info # debug | info | warn | error
  format: json # json | text
  # Optional log file (process logs, NOT audit logs). Stderr if empty.
  file: ""

# ---- Sentinel-aware role detection -------------------------------------------
# Redis Watcher should run on Redis Sentinel-managed clusters ONLY against the
# current primary. When the upstream Redis is a replica, the entire pipeline
# (MONITOR consumption, outputs, metrics, alerts) is paused. As soon as the
# instance is promoted to primary again, work resumes automatically.
#
# This avoids:
#   * the real source IP:PORT will be shown only when the instance is master
#   * duplicated audit trails on every replica in a fleet
#   * spurious "FLUSH*"/"CONFIG" alerts caused by replication command stream
#   * wasted CPU running MONITOR on follower nodes
#
# The role is probed with `INFO replication` on a separate connection at the
# interval configured below. See `redis_watcher_redis_is_master` and
# `redis_watcher_redis_role_transitions_total` in the metrics endpoint to
# observe transitions.
role_check:
  enabled: true
  interval: 5s # how often to probe the role
  dial_timeout: 3s
  read_timeout: 3s
  # Escape hatch: when true, run regardless of role. Use this only for
  # debugging or for non-Sentinel deployments where you explicitly want to
  # audit a replica.
  allow_replica: false

# ---- Global event filter ------------------------------------------------------
# Commands listed here are dropped early in the pipeline. They will NOT be
# logged to any output, will NOT increment Prometheus counters and will NOT
# trigger alerts. Use this to silence high-volume, low-value noise on busy
# production hosts.
#
# Matching is case-insensitive on the command name (the first token of the
# Redis command). To also drop subcommand-routed commands like CLIENT, list
# the parent command name -- e.g. listing "CLIENT" silences CLIENT GETNAME,
# CLIENT LIST, CLIENT KILL, ... and you can keep an entry for CLIENT KILL in
# alerts.suspicious_commands by NOT adding CLIENT here.
#
# NOTE: this differs from `metrics.ignored_commands` below, which only
# suppresses Prometheus labels for the command while still emitting the
# event to outputs and the alert engine.
filter:
  ignored_commands:
    - PING
    - INFO
    - AUTH
    - SELECT
    - HELLO
    - COMMAND
    - SUBSCRIBE
    - UNSUBSCRIBE
    - PSUBSCRIBE
    - PUNSUBSCRIBE
    # - PUBLISH        # uncomment to silence pub/sub traffic
    # - CLUSTER        # uncomment to silence sentinel/cluster chatter

# ---- Audit event outputs ------------------------------------------------------
# Each parsed MONITOR event is sent to every enabled output.
outputs:
  - type: stdout
    enabled: false
    format: json # json | text

  - type: file
    enabled: true
    path: /var/log/redis-watcher/audit.log
    format: json
    rotation:
      max_size_mb: 100 # rotate when file reaches this size
      max_backups: 5 # number of rotated files to keep
      max_age_days: 30 # max age in days
      compress: true # gzip rotated files

  - type: udp
    enabled: false
    address: 127.0.0.1:24224 # e.g. Fluent Bit / Fluentd forward
    format: json
    timeout: 2s

  - type: tcp
    enabled: false
    address: 127.0.0.1:24224
    format: json
    timeout: 5s
    keepalive: 30s

# ---- Prometheus metrics endpoint ---------------------------------------------
# The HTTP server exposes:
#   GET <path>      Prometheus exposition (Go runtime + process + project metrics)
#   GET /healthz    Liveness probe (always 200 while the process is up). Use as
#                   the Kubernetes liveness probe — must NEVER fail-close on
#                   transient downstream outages, or the pod restart-loops.
#   GET /readyz     Readiness probe. Returns 503 with a JSON body when any of:
#                     * MONITOR is not currently connected, or
#                     * the role checker hasn't determined the role, or
#                     * any output is currently in a failing state, or
#                     * any alert channel is currently in a failing state.
#                   Use as the Kubernetes readiness probe / blue-green gate.
#
# See README -> "Prometheus metrics" for the full catalogue (health gauges,
# throughput counters, error counters, latency histograms, queue depth gauges,
# Go runtime + process collectors).
metrics:
  enabled: true
  address: ":9100"
  path: /metrics
  # Optional list of command names (uppercase) to NOT track per-command (to limit
  # cardinality if needed). Empty = track all.
  ignored_commands: []
  # Track per-source-IP metrics (can have high cardinality on busy servers).
  track_source_ip: true

# ---- Alerting -----------------------------------------------------------------
alerts:
  enabled: true
  # Suspicious commands (uppercase, matched against parsed command name).
  # The subcommand may be matched with patterns like "CLIENT KILL".
  suspicious_commands:
    - FLUSHDB
    - FLUSHALL
    - CONFIG
    - ACL
    - KEYS
    - EVAL
    - EVALSHA
    - SCRIPT
    - SHUTDOWN
    - DEBUG
    - MODULE
    - REPLICAOF
    - SLAVEOF
    - MIGRATE
    - SAVE
    - BGSAVE
    - BGREWRITEAOF
    - FUNCTION

  # Optional regex (matched on the full reconstructed command line, case
  # insensitive). Used in addition to suspicious_commands.
  patterns: []

  # Optional allowlist of source IPs for which alerts are suppressed.
  ignored_source_ips: []

  # Rate-limit: at most `max_alerts` alerts per `window` per (command, ip) tuple.
  rate_limit:
    enabled: true
    window: 60s
    max_alerts: 5

  # Per-channel retry on transient failures.
  #
  # Every configured channel (telegram / webhook / pushgateway) is invoked
  # independently. If a channel returns an error the watcher waits
  # `initial_backoff` and tries again, doubling the wait on each subsequent
  # failure until `max_backoff` is reached.
  #
  # `max_attempts` counts the initial try, so:
  #   - max_attempts: 1 => no retries
  #   - max_attempts: 3 => initial send + up to 2 retries
  #
  # Sentry is notified only after all attempts for a channel have failed,
  # so a single recovered hiccup does not page anyone. Prometheus metrics
  # (alert_send_errors_total) bump once per failed attempt so dashboards
  # still light up on retry storms.
  retry:
    max_attempts: 3
    initial_backoff: 500ms
    max_backoff: 5s

  # Notification channels
  telegram:
    enabled: false
    # Optional override of the Telegram Bot API base URL. Defaults to
    # "https://api.telegram.org" when empty. Useful for self-hosted Bot API
    # servers (https://core.telegram.org/bots/api#using-a-local-bot-api-server)
    # or for routing through an internal HTTP/SNI proxy. Trailing slash is
    # optional and stripped automatically.
    endpoint: ""
    bot_token: ""
    chat_id: "" # may be a user id or "@channel"
    # Optional Telegram topic id. When non-zero this is sent as
    # `message_thread_id` so messages land in a specific topic of a
    # group. Leave 0 (or omit) for regular chats.
    thread_id: 0
    timeout: 5s

  webhook:
    enabled: false
    url: ""
    method: POST
    timeout: 5s
    headers:
      Content-Type: application/json
      # Authorization: "Bearer ..."

  pushgateway:
    enabled: false
    # One or more Pushgateway base URLs. Every alert is pushed to all
    # configured URLs in parallel — use this for HA across availability
    # zones. Send fails only when every push fails.
    urls:
      - http://pushgateway:9091
      # - http://pushgateway-secondary:9091
    # Optional HTTP Basic Auth credentials. The same pair is used for
    # every URL above.
    username: ""
    password: ""
    job: redis-watcher
    timeout: 5s
    # Additional grouping labels pushed with the metric
    labels:
      instance: redis-prod-1

# ---- Sentry (error tracking + performance) -----------------------------------
# All project errors are captured by default when Sentry is enabled. Currently
# instrumented sites include: alert send failures (telegram / webhook /
# pushgateway), upstream MONITOR connection failures, role-probe failures,
# parse errors, output-write failures (transition-only, not every event), and
# panics in any /metrics, /healthz or /readyz handler.
#
# Tracing is opt-in. When traces_sample_rate > 0 the watcher emits the
# following transactions:
#   - alert.dispatch        (one per fired alert; child http.client spans per
#                            channel — telegram / webhook / pushgateway)
#   - role.probe            (one per INFO replication poll)
#   - http.server           (one per /metrics, /healthz, /readyz request)
#
# On busy clusters alerts can be high-volume; sample at 0.01–0.05 in
# production unless you specifically need full-fidelity traces.
sentry:
  enabled: false
  dsn: ""
  environment: production
  release: ""
  # Error sampling. 1.0 = report every error.
  sample_rate: 1.0
  # Performance sampling. 0.0 disables tracing entirely.
  traces_sample_rate: 0.0
  # Attach stacktraces to non-exception events (informational captures).
  attach_stacktrace: true

# ---- Internal pipeline tuning -------------------------------------------------
pipeline:
  # Buffer for raw parsed events between MONITOR consumer and dispatcher.
  event_buffer: 10000
  # Per-consumer (each output / alerter) buffer.
  consumer_buffer: 2000
  # If a consumer's buffer is full, drop the event (true) or block (false).
  # `true` is recommended in production to avoid back-pressuring MONITOR which
  # could cause Redis to disconnect us.
  drop_on_full: true
