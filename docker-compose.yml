name: redis-watcher

services:
  redis:
    image: redis:8
    container_name: rw-redis
    restart: unless-stopped
    command: >-
      redis-server
      --unixsocket /var/run/redis/redis.sock
      --unixsocketperm 777
      --bind 0.0.0.0
      --port 6379
      --save 60 1
      --appendonly yes
    user: redis
    volumes:
      - redis-data:/data
      - ./redis-socket:/var/run/redis
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  redis-watcher:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-local}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    image: redis-watcher:${VERSION:-dev}
    container_name: rw-watcher
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./config.yaml:/etc/redis-watcher/config.yaml:ro
      - ./redis-socket:/var/run/redis:ro
      - audit-logs:/var/log/redis-watcher
    ports:
      - "9100:9100"
    environment:
      REDIS_WATCHER_CONFIG: /etc/redis-watcher/config.yaml
      REDIS_WATCHER_REDIS_ADDRESS: /var/run/redis/redis.sock

volumes:
  redis-data:
  audit-logs:
